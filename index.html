<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>CostPulse</title>
<style>
  :root{
    --radius:0.625rem;
    --background: oklch(0.16 0.02 260);
    --foreground: oklch(0.98 0.005 250);
    --card: oklch(0.21 0.025 260);
    --muted: oklch(0.25 0.025 260);
    --muted-foreground: oklch(0.72 0.02 255);
    --border: oklch(1 0 0 / 8%);
    --input: oklch(1 0 0 / 12%);
    --success: oklch(0.78 0.19 150);
    --warning: oklch(0.82 0.17 85);
    --danger: oklch(0.68 0.22 25);
    --accent: oklch(0.78 0.19 150);
    --fg: var(--foreground);
    --r-sm:calc(var(--radius) - 2px);
    --r-lg:var(--radius);
    --r-2xl:calc(var(--radius) + 8px);
    --r-3xl:calc(var(--radius) + 12px);
    --shadow:0 10px 15px -3px rgba(0,0,0,.25),0 4px 6px -4px rgba(0,0,0,.25);
  }
  *{box-sizing:border-box;border-color:var(--border)}
  html,body{margin:0;padding:0}
  body{
    background:var(--background);
    color:var(--foreground);
    font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }
  .tabular{font-variant-numeric:tabular-nums}
  .ic{width:1em;height:1em;display:inline-block;vertical-align:-0.13em;flex:none}
  .topbar{border-bottom:1px solid var(--border);background:color-mix(in oklab,var(--card) 60%,transparent);backdrop-filter:blur(8px);position:sticky;top:0;z-index:30}
  .topbar-in{max-width:1152px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 16px}
  .page{max-width:1152px;margin:0 auto;padding:24px 16px 40px}
  @media(min-width:768px){.page{padding:40px 32px}.topbar-in{padding:12px 32px}}
  .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted-foreground);font-weight:500}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-2xl);box-shadow:var(--shadow);padding:24px}
  .innerbox{background:color-mix(in oklab,var(--background) 40%,transparent);border:1px solid var(--border);border-radius:var(--r-2xl);padding:16px}
  .card h3{margin:4px 0 0;font-size:18px;font-weight:600;letter-spacing:-.01em}
  .muted{color:var(--muted-foreground)}
  .small{font-size:13px}
  .row{display:flex;gap:12px}
  .row.wrap{flex-wrap:wrap}
  .grid{display:grid;gap:16px}
  .btn{cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--foreground);border-radius:var(--r-lg);padding:9px 16px;font-size:13px;font-weight:500;transition:all .15s;display:inline-flex;align-items:center;gap:8px;line-height:1}
  .btn:hover{background:color-mix(in oklab,var(--foreground) 6%,transparent)}
  .btn.lg{padding:12px 22px;font-size:15px;border-radius:var(--r-lg)}
  .btn.primary{background:var(--danger);border-color:transparent;color:#fff}
  .btn.primary:hover{opacity:.9;background:var(--danger)}
  .btn.green{background:transparent;border-color:var(--success);color:var(--success)}
  .btn.green:hover{background:color-mix(in oklab,var(--success) 12%,transparent)}
  .btn.green.solid{background:var(--success);border-color:transparent;color:var(--background)}
  .btn.green.solid:hover{opacity:.9;background:var(--success)}
  .btn.accent{background:var(--accent);border-color:transparent;color:var(--background)}
  .btn.accent:hover{opacity:.9;background:var(--accent)}
  .btn.sm{padding:6px 11px;font-size:12px;border-radius:var(--r-sm)}
  .btn.icon{padding:7px;border-radius:var(--r-sm)}
  .btn.ghost{border-color:transparent}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  input,select,textarea{background:color-mix(in oklab,var(--background) 60%,transparent);color:var(--foreground);border:1px solid var(--input);border-radius:var(--r-sm);padding:9px 12px;font-size:14px;font-family:inherit;width:100%}
  input:focus,select,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in oklab,var(--accent) 30%,transparent)}
  label.field{display:block;font-size:13px;color:var(--muted-foreground);margin-bottom:6px;font-weight:500}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:600}
  .barbg{height:12px;border-radius:999px;background:var(--muted);overflow:hidden}
  .barfill{height:100%;border-radius:999px;transition:width .6s cubic-bezier(.4,0,.2,1)}
  .tabbar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;margin:32px 0 0;background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:4px}
  @media(max-width:760px){.tabbar{grid-auto-flow:row;grid-auto-columns:unset;grid-template-columns:repeat(2,1fr)}}
  .tab{cursor:pointer;padding:8px 12px;border-radius:var(--r-sm);font-size:13px;font-weight:500;color:var(--muted-foreground);text-align:center;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:5px}
  .tab:hover{color:var(--foreground)}
  .tab.active{background:color-mix(in oklab,var(--foreground) 8%,transparent);color:var(--foreground)}
  .tab .dot{display:inline-block;width:6px;height:6px;border-radius:99px;background:var(--warning)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted-foreground);font-weight:500}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .pill{font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid var(--border);color:var(--muted-foreground);font-weight:500}
  .modalbg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;backdrop-filter:blur(2px)}
  .modalbg.open{display:flex}
  .modal{background:var(--card);border:1px solid var(--border);border-radius:var(--r-2xl);max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:24px;box-shadow:var(--shadow)}
  .modal h3{margin:0 0 4px;font-size:18px}
  .close{float:right;cursor:pointer;color:var(--muted-foreground);font-size:22px;line-height:1;border:none;background:none}
  .toast-wrap{position:fixed;bottom:20px;right:20px;z-index:100;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
  .toast{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--r-lg);padding:12px 16px;font-size:14px;box-shadow:var(--shadow);animation:slidein .25s ease;max-width:360px}
  .toast.good{border-left-color:var(--success)}
  .toast.bad{border-left-color:var(--danger)}
  @keyframes slidein{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
  .confetti{position:fixed;width:10px;height:14px;top:-20px;z-index:90;pointer-events:none;border-radius:2px}
  @keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.2}}
  .hero-total{font-size:clamp(40px,8vw,60px);font-weight:700;line-height:1;letter-spacing:-.03em}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .cols3{display:grid;grid-template-columns:2fr 1fr;gap:24px}
  @media(max-width:900px){.split,.cols3{grid-template-columns:1fr}}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
  .kv:last-child{border-bottom:none}
  .switcher{display:inline-flex;gap:4px}
  .switcher button{border:1px solid transparent;background:none;color:var(--muted-foreground);font-weight:500;font-size:13px;padding:6px 14px;border-radius:999px;cursor:pointer;transition:all .15s}
  .switcher button:hover{color:var(--foreground)}
  .switcher button.on{background:var(--accent);color:var(--background);font-weight:600}
  .drop{border:2px dashed var(--border);border-radius:var(--r-2xl);padding:28px;text-align:center;color:var(--muted-foreground);transition:all .15s}
  .drop.hot{border-color:var(--accent);color:var(--foreground);background:color-mix(in oklab,var(--accent) 8%,transparent)}
  .tag{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600}
  .badge-out{font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid;font-weight:500;display:inline-flex;align-items:center;gap:4px}
  .bleed{border:1px solid var(--danger);background:color-mix(in oklab,var(--danger) 12%,transparent);border-radius:var(--r-2xl);padding:18px 22px;margin-bottom:24px;animation:bleedPulse 1.8s infinite}
  @keyframes bleedPulse{0%,100%{box-shadow:0 0 0 1px color-mix(in oklab,var(--danger) 40%,transparent),0 0 40px color-mix(in oklab,var(--danger) 22%,transparent)}50%{box-shadow:0 0 0 1px color-mix(in oklab,var(--danger) 60%,transparent),0 0 60px color-mix(in oklab,var(--danger) 50%,transparent)}}
  .dotpulse{width:10px;height:10px;border-radius:99px;background:var(--danger);animation:bleedDot 1.4s infinite;flex:none}
  @keyframes bleedDot{0%,100%{opacity:1}50%{opacity:.3}}
  a{color:var(--accent)}
  .logoimg{height:20px;width:20px;object-fit:contain}
  /* Flytande lägg-till-knapp */
  .fab{position:fixed;right:18px;bottom:18px;z-index:60;width:56px;height:56px;border-radius:99px;
    background:var(--danger);color:#fff;border:none;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.45);
    display:flex;align-items:center;justify-content:center;font-size:22px;transition:transform .15s}
  .fab:hover{transform:scale(1.06)}
  .fab svg{width:24px;height:24px}
  /* Bulk-läge */
  .bulkbar{position:fixed;left:16px;right:16px;bottom:16px;z-index:70;max-width:720px;margin:0 auto;
    background:var(--card);border:1px solid var(--accent);border-radius:var(--r-2xl);box-shadow:var(--shadow);
    padding:12px 16px;display:none}
  .bulkbar.on{display:block}
  .itemrow.picked{background:color-mix(in oklab,var(--accent) 10%,transparent);border-radius:10px}
  .itemchk.sel{accent-color:var(--accent)}
  /* Sökrad */
  .searchbar{display:grid;grid-template-columns:1fr 190px 150px;gap:8px;
    position:sticky;top:56px;z-index:20;background:var(--card);padding:8px 0}
  .searchbar input[type=search]{-webkit-appearance:none}
  /* Klickbart belopp (snabbredigering) */
  .amtbtn{background:none;border:1px dashed transparent;color:var(--foreground);font-weight:700;font-size:15px;
    cursor:pointer;padding:3px 6px;border-radius:8px;font-family:inherit;display:inline-flex;align-items:center;gap:5px;
    font-variant-numeric:tabular-nums;transition:all .15s}
  .amtbtn:hover{border-color:var(--accent);color:var(--accent)}
  .amtbtn svg{opacity:.45;width:.8em;height:.8em}
  /* Kostnadslista som staplade kort (funkar på dator + mobil, inget sidoscroll) */
  .itemrow{padding:14px 2px;border-bottom:1px solid var(--border)}
  .itemrow:last-child{border-bottom:none}
  .itemrow.off{opacity:.45}
  .itemrow-top{display:flex;gap:12px;align-items:flex-start}
  .itemchk{width:22px!important;height:22px;flex:none;margin:2px 0 0;accent-color:var(--success);padding:0}
  .itemrow-body{min-width:0;flex:1}
  .itemrow-name{font-weight:600;line-height:1.3}
  .itemrow-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:5px}
  .itemrow-amt{text-align:right;white-space:nowrap;flex:none}
  .itemrow-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;padding-left:34px}
  html,body{touch-action:manipulation}
  /* ===================== MOBIL: kompakt, enkel, ingen zoom ===================== */
  @media(max-width:640px){
    .page{padding:12px 12px 88px}
    .card{padding:14px;border-radius:16px}
    .hero{padding:16px}
    .innerbox{padding:11px;border-radius:12px}
    .hero-total{font-size:32px;letter-spacing:-.02em}
    .split,.cols3{gap:10px}
    .topbar-in{padding:9px 12px;gap:8px}
    .topbar-in .muted.small{display:none}
    /* Hero-stats sida vid sida = mindre scroll */
    .herostats{grid-template-columns:1fr 1fr;gap:8px}
    .herostats .innerbox{padding:10px}
    .herostats .hstat{font-size:19px!important}
    .herostats .eyebrow{font-size:9px;letter-spacing:.1em}
    .herostats .chip{font-size:10px;padding:2px 6px}
    .herostats .barbg{height:9px}
    /* Hero-knappar 2 per rad */
    .heroacts{gap:8px!important}
    .heroacts .btn.lg{flex:1 1 calc(50% - 10px);min-width:calc(50% - 10px);width:auto;padding:12px 6px;font-size:13.5px;min-height:44px}
    /* Flikrad: kompakt rutnät som fyller bredden – alla flikar syns, ingen sidoscroll */
    .tabbar{display:grid;grid-auto-flow:row;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:14px;padding:4px}
    .tab{padding:8px 3px;font-size:11.5px;min-height:34px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .tab .dot{width:5px;height:5px}
    #tabbody{margin-top:16px!important}
    /* Knappar */
    .btn{padding:10px 14px;font-size:14px;min-height:42px}
    .btn.sm{padding:8px 11px;font-size:13px;min-height:36px}
    .btn.lg{padding:13px;font-size:14px}
    .btn.icon{width:42px;height:42px;justify-content:center}
    .btn.sm.icon{width:36px;height:36px;padding:0}
    /* Inputs: 16px så mobilen inte auto-zoomar */
    input,select,textarea{font-size:16px;padding:12px}
    label.field{font-size:13px}
    /* Dölj sekundära tabellkolumner */
    .hide-sm{display:none!important}
    th,td{padding:10px 6px}
    table{font-size:14px}
    /* Mindre rubriker/text */
    .card h3{font-size:16px}
    .eyebrow{font-size:10px}
    /* Modaler som bottenpaneler */
    .modalbg{padding:0;align-items:flex-end}
    .modal{max-width:100%;border-radius:20px 20px 0 0;max-height:92vh;padding:18px}
    .close{font-size:28px;padding:4px 8px}
    #updateBanner{left:8px;right:8px;bottom:8px}
    .kv{padding:9px 0;font-size:14px}
    /* DET BLÖDER-bannern kompakt */
    .bleed{padding:14px 16px}
    .bleednum{font-size:17px!important}
    .bleed .row{flex-wrap:wrap;gap:10px}
    .bleed .row > div[style*="flex:1"]{flex:1 1 100%}
    .bleed .btn{width:100%;justify-content:center}
    /* Kostnadslista */
    .itemrow-actions{padding-left:0;gap:8px}
    .itemrow-actions .btn{flex:1 1 auto;justify-content:center;min-width:calc(50% - 4px)}
    .itemrow-amt .tabular{font-size:15px!important}
    .monthsel{min-width:100px!important;font-size:14px!important;padding:9px!important}
    .searchbar{grid-template-columns:1fr!important;gap:6px!important;top:50px}
    .fab{right:14px;bottom:14px;width:52px;height:52px}
    .bulkbar{left:8px;right:8px;bottom:8px;padding:10px 12px}
    .bulkbar .btn{flex:1 1 calc(50% - 6px);justify-content:center}
    .searchbar select{font-size:15px!important;padding:10px!important}
    .amtbtn{font-size:15px!important;padding:5px 7px}
    /* Jämför-vyn: månadskort sida vid sida även på mobil */
    .cmpcols{grid-template-columns:1fr 1fr!important;gap:8px!important}
    .cmpcols .innerbox{padding:10px}
    .cmpcols .tabular{font-size:18px!important}
    .cmpcols .eyebrow{font-size:9px;letter-spacing:.08em}
    .cmpcols .muted.small{font-size:11px;line-height:1.3}
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-in">
    <img id="topLogo" class="logoimg" alt="CostPulse" />
    <span class="eyebrow" style="display:none" id="bolagLbl">Bolag</span>
    <span class="eyebrow" id="bolagLbl2">Bolag</span>
    <div class="switcher" id="switcher" style="margin-left:2px">
      <button data-co="westros" class="on">Westros</button>
      <button data-co="eefs">EEFS</button>
    </div>
    <div class="row" style="margin-left:auto;align-items:center;gap:8px">
      <button class="btn sm" id="lockBtn" onclick="onLockBtn()" title="Data-lås" style="display:none"></button>
      <button class="btn sm" onclick="openMobile()" title="Öppna på mobilen">📱 Mobil</button>
      <span class="muted small" id="tagline" style="display:none"></span>
    </div>
  </div>
</div>
<div class="page">
  <div id="app"></div>
</div>

<button class="fab" id="fab" onclick="openItemDialog()" title="Lägg till kostnad (n)">＋</button>
<div class="bulkbar" id="bulkbar">
  <div class="row wrap" style="align-items:center;gap:8px">
    <div style="flex:1;min-width:130px"><b id="bulkCount">0 markerade</b><div class="muted small" id="bulkSum"></div></div>
    <button class="btn sm" onclick="bulkCategory()">Byt kategori</button>
    <button class="btn sm" onclick="bulkMove()">Flytta till månad</button>
    <button class="btn sm primary" onclick="bulkDelete()">Radera</button>
    <button class="btn sm ghost" onclick="exitSelMode()">Avbryt</button>
  </div>
</div>
<div id="dataBanner" style="display:none;position:fixed;left:16px;right:16px;bottom:16px;z-index:81;max-width:520px;margin:0 auto;background:var(--card);border:1px solid var(--success);border-radius:var(--r-2xl);box-shadow:var(--shadow);padding:14px 18px">
  <div class="row" style="align-items:center;gap:12px">
    <span style="font-size:22px">📊</span>
    <div style="flex:1"><div style="font-weight:600">Ny kostnadsdata finns</div><div class="muted small">Uppdatera för att hämta senaste siffrorna.</div></div>
    <button class="btn green solid" onclick="refreshData()">Uppdatera</button>
    <button class="btn ghost sm" onclick="dismissDataBanner()">Senare</button>
  </div>
</div>
<div id="updateBanner" style="display:none;position:fixed;left:16px;right:16px;bottom:16px;z-index:80;max-width:520px;margin:0 auto;background:var(--card);border:1px solid var(--accent);border-radius:var(--r-2xl);box-shadow:var(--shadow);padding:14px 18px">
  <div class="row" style="align-items:center;gap:12px">
    <span style="font-size:22px">✨</span>
    <div style="flex:1"><div style="font-weight:600">Ny version tillgänglig</div><div class="muted small" id="updateVer">En uppdatering av CostPulse finns.</div></div>
    <button class="btn accent" onclick="doUpdate()">Uppdatera</button>
    <button class="btn ghost sm" onclick="document.getElementById('updateBanner').style.display='none'">Senare</button>
  </div>
</div>

<div class="modalbg" id="modalbg"><div class="modal" id="modal"></div></div>
<div class="toast-wrap" id="toasts"></div>

<script>
"use strict";
/* ============================= CostPulse — fristående ============================= */
const CATEGORIES = ["Anställda","Shopify-appar","Annons-/marknadsföringsverktyg","Mjukvara/SaaS","Frakt/logistik","Övrigt"];
const INTERVALS = ["månad","kvartal","år"];
const DEFAULT_SETTINGS = { goal:20000, greenMax:2000, redMin:10000 };
const FX_FALLBACK = { SEK:1, EUR:0.087, NOK:1.06, DKK:0.65, USD:0.095 }; // 1 SEK = X foreign
const CATCOLORS = {
  "Anställda":"oklch(0.78 0.19 150)","Shopify-appar":"oklch(0.72 0.14 200)",
  "Annons-/marknadsföringsverktyg":"oklch(0.70 0.18 300)","Mjukvara/SaaS":"oklch(0.82 0.17 85)",

/* ============================= Store (localStorage) ============================= */
const uid = () => Math.random().toString(36).slice(2,10);
function K(ns){ const p="slimma."+ns; return {
  costs:p+".costs.v1", sim:p+".sim.v1", settings:p+".settings.v1", history:p+".history.v1",
  savings:p+".savings.v1", costlog:p+".costlog.v1", focus:p+".focus.v1", stores:p+".stores.v1",
  budgets:p+".budgets.v1", prefs:"slimma.appprefs.v1" }; }

function load(key, fb){ try{ const r=localStorage.getItem(key); return r?JSON.parse(r):fb; }catch(e){ return fb; } }
function save(key, val){ localStorage.setItem(key, JSON.stringify(val)); window.dispatchEvent(new CustomEvent("slimma:store-sync",{detail:{key}})); }

const State = {
  ns:"westros",
  tab:"oversikt",
  q:"", catFilter:"", sortBy:"amount", selMode:false, sel:null,
  get co(){ return COMPANIES[this.ns]; },
  get k(){ return K(this.ns); }
};

/* ---- Månadslager: kostnader + simulering lagras per (bolag, månad) ---- */
function monthsKey(){ return "slimma."+State.ns+".months.v1"; }
function curMonthKey(){ return "slimma."+State.ns+".curmonth.v1"; }
function costKey(m){ return "slimma."+State.ns+".costs."+(m||curMonth())+".v1"; }
function simKey(m){ return "slimma."+State.ns+".sim."+(m||curMonth())+".v1"; }
function savingsKey(m){ return "slimma."+State.ns+".savings."+(m||curMonth())+".v1"; }
function costlogKey(m){ return "slimma."+State.ns+".costlog."+(m||curMonth())+".v1"; }
function getMonths(){ let m=load(monthsKey(),null); if(!Array.isArray(m)||!m.length){ m=["aktuell"]; localStorage.setItem(monthsKey(),JSON.stringify(m)); } return m; }
function curMonth(){ const months=getMonths(); let c=load(curMonthKey(),null); if(!c||months.indexOf(c)<0){ c=months[0]; localStorage.setItem(curMonthKey(),JSON.stringify(c)); } return c; }
function setCurMonth(m){ localStorage.setItem(curMonthKey(),JSON.stringify(m)); }
function ensureMonth(m){ const months=getMonths(); if(months.indexOf(m)<0){ months.push(m); localStorage.setItem(monthsKey(),JSON.stringify(months)); } }
function addMonth(name){ name=(name||"").trim(); if(!name) return; ensureMonth(name); if(localStorage.getItem(costKey(name))===null) localStorage.setItem(costKey(name),JSON.stringify([])); setCurMonth(name); render(); }
function renameMonth(oldN,newN){ newN=(newN||"").trim(); if(!newN||oldN===newN) return;
  const months=getMonths().map(m=>m===oldN?newN:m); localStorage.setItem(monthsKey(),JSON.stringify(months));
  ["costs","sim"].forEach(t=>{ const ok="slimma."+State.ns+"."+t+"."+oldN+".v1", nk="slimma."+State.ns+"."+t+"."+newN+".v1"; const v=localStorage.getItem(ok); if(v!==null){ localStorage.setItem(nk,v); localStorage.removeItem(ok); } });
  if(curMonth()===oldN) setCurMonth(newN); render(); }
function deleteMonth(m){ let months=getMonths(); if(months.length<=1){ toast("Kan inte ta bort sista månaden.","bad"); return; }
  months=months.filter(x=>x!==m); localStorage.setItem(monthsKey(),JSON.stringify(months));
  localStorage.removeItem(costKey(m)); localStorage.removeItem(simKey(m));
  if(curMonth()===m) setCurMonth(months[0]); render(); }
function getItems(){ return load(costKey(), null) || []; }
function setItems(items){ save(costKey(), items); snapshotIfNeeded(); }
function getSim(){ return new Set(load(simKey(), [])); }

/* seed on first run (+ migrera gammal enkellista → månad "aktuell") */
function ensureSeed(){
  getMonths(); curMonth(); // säkerställ månadsstruktur
  const ck=costKey();
  if(localStorage.getItem(ck)!==null) return;
  const old=localStorage.getItem("slimma."+State.ns+".costs.v1"); // äldre version utan månader
  if(old!==null && curMonth()==="aktuell"){
    localStorage.setItem(ck, old);
    ["savings","costlog"].forEach(t=>{ const lk="slimma."+State.ns+"."+t+".v1", v=localStorage.getItem(lk);
      const nk=(t==="savings"?savingsKey("aktuell"):costlogKey("aktuell"));
      if(v!==null && localStorage.getItem(nk)===null) localStorage.setItem(nk, v); });
    return; }
  localStorage.setItem(ck, JSON.stringify(State.ns==="westros"?withIds(JUNE_2026):withIds(EEFS_SEED)));
}
function withIds(list){ return list.map(i=>Object.assign({},i,{id:uid(), transactions:i.transactions?i.transactions.map(t=>Object.assign({id:t.id||uid()},t)):undefined})); }

/* ============================= Beräkningar ============================= */
function monthlyAmount(i){ return i.interval==="kvartal"? i.amount/3 : i.interval==="år"? i.amount/12 : i.amount; }
function yearlyAmount(i){ return monthlyAmount(i)*12; }
function rawTotal(items){ return items.reduce((s,i)=>s+monthlyAmount(i),0); }
function logDelta(){ return sum(getCostlog()) - sum(getSavings()); }
function sum(arr){ return arr.reduce((s,e)=>s+(+e.amount||0),0); }
function computeTotal(items){ return Math.max(0, rawTotal(items)+logDelta()); }
function simTotal(items,sim){ return Math.max(0, items.filter(i=>!sim.has(i.id)).reduce((s,i)=>s+monthlyAmount(i),0)+logDelta()); }
function zoneOf(daily,s){ s=s||getSettings();
  if(daily<=s.greenMax) return {key:"green",label:"Green zone – riktigt bra!",color:"var(--success)"};
  if(daily<s.redMin) return {key:"yellow",label:"Okej, men mer att göra",color:"var(--warning)"};
  return {key:"red",label:"Det blöder – dags att agera",color:"var(--danger)"}; }
const fmtSEK = n => new Intl.NumberFormat("sv-SE",{maximumFractionDigits:0}).format(Math.round(n))+" kr";
const fmt2 = n => new Intl.NumberFormat("sv-SE",{minimumFractionDigits:2,maximumFractionDigits:2}).format(n);
const fmtN = n => new Intl.NumberFormat("sv-SE",{maximumFractionDigits:0}).format(Math.round(n));

function snapshotIfNeeded(){
  if(!State.co.hasSnapshots) return;
  const total = rawTotal(getItems());
  let h = load(State.k.history, []);
  const last = h[h.length-1];
  if(last && Math.abs(last.total-total)<0.5) return;
  const now = Date.now();
  if(last && now-last.t < 60000) h = h.slice(0,-1).concat([{t:now,total}]);
  else h = h.concat([{t:now,total}]);
  if(h.length>500) h = h.slice(h.length-500);
  localStorage.setItem(State.k.history, JSON.stringify(h));
}

function celebrate(big){
  const n = big?90:44, colors=["#3ddc84","#ffd23f","#ff6b6b","#6bc1ff","#c17bff"];
  for(let i=0;i<n;i++){
    const c=document.createElement("div"); c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.background=colors[i%colors.length];
    const dur=1.6+Math.random()*1.4;
    c.style.animation=`fall ${dur}s ease-in forwards`;
    c.style.transform=`translateY(0) rotate(${Math.random()*360}deg)`;
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), dur*1000+200);
  }
}
let AC;
function chime(kaching){
  if(!getPrefs().sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const notes = kaching?[880,1320]:[660,990];
    notes.forEach((f,idx)=>{
      const o=AC.createOscillator(), g=AC.createGain();
      o.type="triangle"; o.frequency.value=f;
      o.connect(g); g.connect(AC.destination);
      const t=AC.currentTime+idx*0.09;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.25,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.4);
      o.start(t); o.stop(t+0.42);
    });
  }catch(e){}
}
function haptic(ms){ if(getPrefs().haptics && navigator.vibrate) navigator.vibrate(ms||30); }

function toast(msg, kind){
  const el=document.createElement("div"); el.className="toast"+(kind?" "+kind:"");
  el.innerHTML=msg;
  document.getElementById("toasts").appendChild(el);
  setTimeout(()=>{el.style.transition="opacity .3s";el.style.opacity="0";setTimeout(()=>el.remove(),300)}, 4200);
}

/* ============================= Sifferparsning (svensk) ============================= */
function parseSwedishNumber(str){
  if(typeof str==="number") return str;
  if(!str) return NaN;
  let s=String(str).trim().replace(/kr/ig,"").replace(/\s/g,"").replace(/[^\d.,-]/g,"");
  if(s==="") return NaN;
  const hasComma=s.includes(","), hasDot=s.includes(".");
  if(hasComma&&hasDot){
    if(s.lastIndexOf(",")>s.lastIndexOf(".")) s=s.replace(/\./g,"").replace(",",".");
    else s=s.replace(/,/g,"");
  } else if(hasComma){
    // comma decimal if 1-2 digits after last comma, else thousands
    const parts=s.split(",");
    if(parts[parts.length-1].length<=2 && parts.length===2) s=s.replace(",",".");
    else s=s.replace(/,/g,"");
  }
  const n=parseFloat(s);
  return isNaN(n)?NaN:n;
}

function goalBar(total,s){
  const goal=s.goal, ceiling=Math.max(goal*2,total,1);
  const fill = total<=goal?100:((ceiling-total)/(ceiling-goal))*100;
  const pct = total<=0?100:Math.round(goal/total*100);
  const under = total<=goal;
  return `<div style="margin-top:8px">
    <div class="barbg"><div class="barfill" style="width:${Math.max(2,Math.min(100,fill))}%;background:${under?"var(--success)":total/30>=s.redMin?"var(--danger)":"var(--warning)"}"></div></div>

      <span class="muted small">${under?`Du är ${fmtSEK(goal-total)} under målet 🎉`:`${fmtSEK(total-goal)} kvar att skära`}</span>
    </div></div>`;
}

function tabOversikt(){
  const items=getItems();
  const byCat={}; CATEGORIES.forEach(c=>byCat[c]=0);
  items.forEach(i=>byCat[i.category]+=monthlyAmount(i));
  const total=Object.values(byCat).reduce((a,b)=>a+b,0)||1;
  const cats=CATEGORIES.map(c=>({c,v:byCat[c]})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  // donut
  let acc=0, segs="";
  const R=70,C=2*Math.PI*R;
  cats.forEach(x=>{ const frac=x.v/total; const len=frac*C;
    segs+=`<circle r="${R}" cx="90" cy="90" fill="none" stroke="${CATCOLORS[x.c]}" stroke-width="26" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-acc}" transform="rotate(-90 90 90)"></circle>`;
    acc+=len; });
  const donut=`<svg viewBox="0 0 180 180" width="180" height="180">${segs}
    <text x="90" y="84" text-anchor="middle" fill="var(--muted)" font-size="10">TOTAL/MÅN</text>
    <text x="90" y="104" text-anchor="middle" fill="var(--fg)" font-size="17" font-weight="700">${fmtN(total)}</text></svg>`;
  const legend=cats.map(x=>`<div class="kv"><span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${CATCOLORS[x.c]};margin-right:7px"></span>${esc(x.c)}</span>
    <span class="tabular">${fmtSEK(x.v)} <span class="muted">· ${Math.round(x.v/total*100)}% · ${fmtSEK(x.v*12)}/år</span></span></div>`).join("");

  return `<div class="cols3">
    <div class="card"><div class="eyebrow">Kostnader per kategori</div><h3>Var ligger pengarna?</h3>
      <div class="row wrap" style="align-items:center;gap:24px;margin-top:16px"><div>${donut}</div><div style="flex:1;min-width:220px">${legend}</div></div></div>
    <div class="card"><div class="eyebrow">Var blöder det?</div><h3>Rekommendationer – agera nu</h3>
      <div style="margin-top:14px">${insightsHtml()}</div></div>
  </div>
  <div class="card" style="margin-top:24px">${duplicatesHtml()}</div>`;

function insightsHtml(){
  const items=getItems(), s=getSettings(), total=computeTotal(items);
  const out=[];
  if(items.length===0){ out.push(ins("info","Lägg till din första kostnad","Börja med att importera juni eller lägg till en post manuellt.",0)); }
  if(total-s.goal>0){ out.push(ins("danger",`Vi ligger ${fmtSEK(total-s.goal)}/mån över målet`,`Det är ${fmtSEK((total-s.goal)*12)}/år. Fokusera på de största posterna först.`,total-s.goal)); }
  const sorted=items.slice().sort((a,b)=>monthlyAmount(b)-monthlyAmount(a));
  sorted.slice(0,6).forEach(i=>{ const m=monthlyAmount(i), share=m/(total||1);
    out.push(ins(share>0.15?"danger":"warn",`Skär i: ${i.name}`,`${Math.round(share*100)}% av totalen. Halvera den och spara ${fmtSEK(m/2)}/mån (${fmtSEK(m*6)}/år).`,m/2)); });
  const car=items.filter(i=>/leasing|f[öo]rs[äa]kring|billeasing/i.test(i.name));
  if(car.length){ const cm=car.reduce((x,i)=>x+monthlyAmount(i),0); out.push(ins("warn","Bil/leasing/försäkring",`${car.length} poster = ${fmtSEK(cm)}/mån. Personligt kopplat – överväg att sälja/pausa.`,cm)); }
  const once=items.filter(i=>/eng[åa]ngs|engangs/i.test(i.name));
  if(once.length){ out.push(ins("info","Möjliga engångskostnader",`${once.map(i=>i.name).join(", ")} bör inte ligga i fast budget – bocka av i simuleringen.`,0)); }
  const ats=items.find(i=>/adsthatscale/i.test(i.name));
  if(ats){ out.push(ins("warn","AdsThatScale = rörlig kostnad","30% av brand-vinsten. Ta TikTok/Snap in-house för att kapa fast byråkostnad.",monthlyAmount(ats)*0.3)); }
  const ajr=items.find(i=>/ajr/i.test(i.name)), kla=items.find(i=>/klaviyo/i.test(i.name));
  if(ajr&&kla){ out.push(ins("warn","AJR + Klaviyo samtidigt","Dubbel e-postkostnad. Flytta AJR in-house till Klaviyo.",monthlyAmount(ajr)*0.6)); }
  const shopApps=items.filter(i=>i.category==="Shopify-appar").reduce((x,i)=>x+monthlyAmount(i),0);
  if(shopApps>10000){ out.push(ins("warn","Shopify-appar > 10 000 kr/mån",`${fmtSEK(shopApps)}/mån i appar. Auditera per butik, rensa oanvänt.`,shopApps*0.25)); }
  if(out.length===1 && total<=s.goal) out.push(ins("good","Under målet!","Snyggt jobbat – håll trenden nedåt.",0));
  return out.map(o=>o).join("");
}
function ins(tone,title,text,saving){
  const col={danger:"var(--danger)",warn:"var(--warning)",info:"var(--muted)",good:"var(--success)"}[tone];

}
function duplicatesHtml(){
  const items=getItems(); const dups=[];
  for(let i=0;i<items.length;i++) for(let j=i+1;j<items.length;j++){
    const a=items[i].name.toLowerCase().trim(), b=items[j].name.toLowerCase().trim();
    if(a&&b&&(a===b || (a.length>4&&b.length>4&&(a.includes(b)||b.includes(a))))) dups.push([items[i].name,items[j].name]);
  }
  if(!dups.length) return `<h3>Möjliga dubletter</h3><div class="muted small">Inga misstänkta dubletter hittades. 👍</div>`;
  return `<h3>⚠️ Möjliga dubletter</h3><div class="muted small">Poster med liknande namn:</div><ul class="small">`+dups.map(d=>`<li>${esc(d[0])} ↔ ${esc(d[1])}</li>`).join("")+`</ul>`;

function toggleSel(id){ const s=selSet(); s.has(id)?s.delete(id):s.add(id); renderItemListOnly(); updateBulkBar(); }

  const bar=document.getElementById("bulkbar"); if(!bar) return;

function bulkDelete(){

/* ---------- Tangentbordsgenvägar (dator) ---------- */
document.addEventListener("keydown",e=>{
  const t=e.target, typing=t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.tagName==="SELECT");
  if(e.key==="Escape"){ if(document.getElementById("modalbg").classList.contains("open")) closeModal(); else if(State.selMode) exitSelMode(); return; }
  if(typing) return;
  if(e.key==="/"){ e.preventDefault(); if(State.tab!=="kostnader") go("kostnader"); setTimeout(()=>{const q=document.getElementById("q"); if(q) q.focus();},60); }
  else if(e.key==="n"||e.key==="N"){ e.preventDefault(); openItemDialog(); }
});

function saveInlineAmount(id){
  const el=document.getElementById("ie-"+id); if(!el) return;
  const n=parseSwedishNumber(el.value);
  if(isNaN(n)||n<0){ toast("Ogiltigt belopp.","bad"); return; }
  const items=getItems(), it=items.find(x=>x.id===id); if(!it) return;
  const before=monthlyAmount(it);
  it.amount=n; setItems(items);
  const after=monthlyAmount(it), diff=before-after;
  render();
  if(diff>0){ toast(`💚 ${esc(it.name)}: −${fmtSEK(diff)}/mån`,"good"); celebrate(diff>=5000); chime(false); haptic(30); }
  else if(diff<0){ toast(`${esc(it.name)}: +${fmtSEK(-diff)}/mån`,"bad"); }
  else { toast("Sparat.","good"); }
}

function tabBesparingar(){
  const items=getItems(), focus=getFocus();
  let html="";

  if(State.co.hasSnapshots && focus.length){
    html+=`<div class="card" style="margin-bottom:16px"><h3>🎯 Fokusmål</h3><div style="margin-top:10px">`;
    html+=focus.map(g=>{ const needles=g.matchNames.map(n=>n.toLowerCase());
      const start=items.filter(i=>needles.some(n=>i.name.toLowerCase().includes(n))).reduce((s,i)=>s+monthlyAmount(i),0);
      const goalAmt=start*(1-g.targetReductionPct);
      // current includes logged savings targeting this
      const logged=getSavings().filter(e=>e.target&&needles.some(n=>e.target.toLowerCase().includes(n))).reduce((s,e)=>s+e.amount,0);
      const cur=Math.max(0,start-logged);
      const prog=start<=goalAmt?100:Math.max(0,Math.min(100,(start-cur)/(start-goalAmt)*100));
      return `<div style="margin-bottom:14px"><div class="row" style="justify-content:space-between"><b>${esc(g.label)}</b><span class="tabular small">${Math.round(prog)}%</span></div>

        <div class="muted small" style="margin-top:5px">Nu ${fmtSEK(cur)}/mån → mål ${fmtSEK(goalAmt)}/mån (−${Math.round(g.targetReductionPct*100)}%). ${esc(g.note||"")}</div></div>`;

      ${logForm("cost")}

      <div class="row" style="justify-content:space-between;margin-top:8px"><span class="muted small">Totalt extra</span><b class="tabular" style="color:var(--danger)">${fmtSEK(sum(cl))}/mån</b></div></div>
  </div>`;
  // savings chart + trend
  html+=`<div class="split" style="margin-top:16px">

    <div class="card"><div class="row" style="justify-content:space-between;align-items:center"><h3>Trend – total/mån</h3><button class="btn sm" onclick="clearHistory()">Rensa</button></div>${trendChart()}</div>
  </div>`;
  return html;
}

function logList(arr,kind){
  if(!arr.length) return `<div class="muted small">Inget loggat ännu.</div>`;
  return arr.map(e=>`<div class="kv"><span>${esc(e.description)}${e.target?` <span class="pill">${esc(e.target)}</span>`:""}<br><span class="muted small">${new Date(e.t).toLocaleDateString("sv-SE")}</span></span>
    <span class="num"><b class="tabular" style="color:${kind==="saving"?"var(--success)":"var(--danger)"}">${kind==="saving"?"−":"+"}${fmtSEK(e.amount)}</b>
    <button class="btn sm ghost" onclick="removeLog('${kind}','${e.id}')">🗑</button></span></div>`).join("");
}
function savingsChart(){
  const sav=getSavings().slice().sort((a,b)=>a.t-b.t);
  if(!sav.length) return `<div class="muted small" style="margin-top:10px">Logga besparingar för att se kurvan växa.</div>`;
  let acc=0; const pts=sav.map(e=>{acc+=e.amount;return {t:e.t,v:acc};});
  const W=300,H=120,max=acc||1;
  const path=pts.map((p,i)=>`${i?"L":"M"} ${10+i/(Math.max(1,pts.length-1))*(W-20)} ${H-10-(p.v/max)*(H-20)}`).join(" ");
  return `<div style="margin-top:10px"><svg viewBox="0 0 ${W} ${H}" width="100%"><path d="${path}" fill="none" stroke="var(--success)" stroke-width="2.5"/></svg>
    <div class="row" style="justify-content:space-between"><span class="muted small">Start</span><b class="tabular" style="color:var(--success)">${fmtSEK(acc)}/mån sparat</b></div></div>`;
}
function trendChart(){
  const h=load(State.k.history,[]), s=getSettings();
  if(h.length<2) return `<div class="muted small" style="margin-top:10px">För få datapunkter ännu. Trenden byggs när totalen ändras.</div>`;
  const W=300,H=120, vals=h.map(x=>x.total).concat([s.goal]);
  const min=Math.min.apply(null,vals),max=Math.max.apply(null,vals),rng=(max-min)||1;
  const y=v=>H-10-((v-min)/rng)*(H-20);
  const path=h.map((p,i)=>`${i?"L":"M"} ${10+i/(h.length-1)*(W-20)} ${y(p.total)}`).join(" ");
  return `<div style="margin-top:10px"><svg viewBox="0 0 ${W} ${H}" width="100%">
    <line x1="10" x2="${W-10}" y1="${y(s.goal)}" y2="${y(s.goal)}" stroke="var(--warning)" stroke-dasharray="4 4" stroke-width="1"/>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5"/></svg>
    <div class="muted small">Gul streckad = mål ${fmtSEK(s.goal)}. Senaste: ${fmtSEK(h[h.length-1].total)}.</div></div>`;
}

async function fetchFX(){
  const bar=document.getElementById("fxbar");
  try{
    const r=await fetch("https://api.frankfurter.app/latest?from=SEK&to=EUR,NOK,DKK,USD");
    if(r.ok){ const j=await r.json(); FXRATES=Object.assign({SEK:1},j.rates); FXNOTE="Live ("+(j.date||"idag")+")"; }
    else throw 0;
  }catch(e){
    try{ const r2=await fetch("https://open.er-api.com/v6/latest/SEK"); const j2=await r2.json();
      if(j2&&j2.rates){ FXRATES={SEK:1,EUR:j2.rates.EUR,NOK:j2.rates.NOK,DKK:j2.rates.DKK,USD:j2.rates.USD}; FXNOTE="Live (er-api)"; }
      else throw 0;
    }catch(e2){ FXRATES=Object.assign({},FX_FALLBACK); FXNOTE="Reservkurs (offline)"; }
  }
  if(bar) bar.innerHTML=`💱 Dagens valutakurs (1 SEK): ${["EUR","NOK","DKK","USD"].map(c=>c+" "+(FXRATES[c]||FX_FALLBACK[c]).toFixed(3)).join(" · ")} — <b>${FXNOTE}</b> <button class="btn sm" onclick="fetchFX()">↻</button>`;
  renderStores();
}
function toSEK(amount,cur){ const rate=(FXRATES&&FXRATES[cur])||FX_FALLBACK[cur]||1; return amount/rate; }

function initImport(){
  const drop=document.getElementById("drop"), file=document.getElementById("file"), restore=document.getElementById("restore");
  const fulldata=document.getElementById("fulldata");
  file.addEventListener("change",e=>{ if(e.target.files[0]) readFile(e.target.files[0]); });
  restore.addEventListener("change",e=>{ if(e.target.files[0]) readRestore(e.target.files[0]); });
  if(fulldata) fulldata.addEventListener("change",e=>{ if(e.target.files[0]) importFullData(e.target.files[0]); });
  ["dragover","dragenter"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("hot");}));
  ["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("hot");}));
  drop.addEventListener("drop",e=>{ const f=e.dataTransfer.files[0]; if(f) readFile(f); });
}
function readFile(f){ const r=new FileReader(); r.onload=()=>{ document.getElementById("paste").value=r.result; parseImport(); }; r.readAsText(f); }
function parseImport(){
  const text=document.getElementById("paste").value.trim();
  if(!text){ toast("Klistra in eller ladda upp något först.","bad"); return; }
  const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const rows=[];
  // monetärt token i slutet av raden: 1 234,56 / 1.234,56 / 1,234.56 / 2400 / -99,00
  const MONEY=/(-?\d{1,3}(?:[  .,]\d{3})*(?:[.,]\d{1,2})?|-?\d+(?:[.,]\d{1,2})?)\s*$/;
  const DATE=/\d{4}-\d{2}-\d{2}|\b\d{1,2}[\/.]\d{1,2}[\/.]\d{2,4}\b/;
  lines.forEach(line=>{
    // hoppa över rubrikrader (ord utan stort belopp)
    if(/^(datum|date|description|beskrivning|belopp|amount|text|typ|kategori)\b/i.test(line) && !/\d{3,}/.test(line)) return;
    let s=line.replace(/\s*kr\b/ig,"").trim();
    const amtM=s.match(MONEY);
    if(!amtM) return;
    const amount=Math.abs(parseSwedishNumber(amtM[1]));
    if(isNaN(amount)||amount===0) return;
    const dateM=line.match(DATE);
    const date=dateM?(/\d{4}-\d{2}-\d{2}/.test(dateM[0])?dateM[0]:dateM[0]):"";
    let desc=s.slice(0,amtM.index);
    if(date) desc=desc.replace(date,"");
    desc=desc.replace(/[;,\t|]+/g," ").replace(/\s{2,}/g," ").replace(/[\s;,-]+$/,"").trim();
    if(!desc) desc="(okänd rad)";
    rows.push({date,description:desc,amount,category:categorize(desc)});
  });
  PARSED=rows;
  if(!rows.length){ document.getElementById("preview").innerHTML=`<div class="muted small">Kunde inte tolka några rader. Kontrollera att varje rad har en beskrivning och ett belopp.</div>`; return; }
  renderPreview();
}
function renderPreview(){
  const rows=PARSED, total=rows.reduce((s,r)=>s+r.amount,0);
  const byCat={}; rows.forEach(r=>byCat[r.category]=(byCat[r.category]||0)+r.amount);
  let html=`<div class="row wrap" style="justify-content:space-between;align-items:center"><h3 style="margin:0">${rows.length} rader tolkade · ${fmtSEK(total)}</h3></div>
    <div class="muted small">Justera kategori vid behov. Välj hur de ska läggas till.</div>
    <div style="overflow-x:auto;margin-top:10px"><table><thead><tr><th>Datum</th><th>Beskrivning</th><th>Kategori</th><th class="num">Belopp</th></tr></thead><tbody>`;
  html+=rows.map((r,i)=>`<tr><td class="muted small">${esc(r.date||"–")}</td><td>${esc(r.description)}</td>
    <td><select onchange="PARSED[${i}].category=this.value">${CATEGORIES.map(c=>`<option ${c===r.category?"selected":""}>${esc(c)}</option>`).join("")}</select></td>
    <td class="num tabular">${fmtSEK(r.amount)}</td></tr>`).join("");
  html+=`</tbody></table></div>
    <div class="row wrap" style="margin-top:14px;gap:8px">
      <button class="btn accent" onclick="applyImport('group')">Lägg till grupperat per kategori</button>
      <button class="btn" onclick="applyImport('each')">Lägg till som separata poster</button>
      <div class="muted small" style="align-self:center">Grupperat = en samlingspost per kategori med alla rader som transaktioner.</div>
    </div>`;
  document.getElementById("preview").innerHTML=html;
}
function applyImport(mode){
  if(!PARSED.length) return;
  const items=getItems();
  if(mode==="each"){
    PARSED.forEach(r=>items.push({id:uid(),name:r.description,amount:r.amount,category:r.category,interval:"månad",transactions:r.date?[{id:uid(),date:r.date,description:r.description,amount:r.amount}]:undefined}));
  }else{
    const groups={};
    PARSED.forEach(r=>{ (groups[r.category]=groups[r.category]||[]).push(r); });
    Object.keys(groups).forEach(cat=>{
      const rows=groups[cat], tot=rows.reduce((s,r)=>s+r.amount,0);
      const label=cat+" (import)";
      let existing=items.find(i=>i.name===label);
      const txs=rows.map(r=>({id:uid(),date:r.date||undefined,description:r.description,amount:r.amount}));
      if(existing){ existing.amount+=tot; existing.transactions=(existing.transactions||[]).concat(txs); }
      else items.push({id:uid(),name:label,amount:tot,category:cat,interval:"månad",note:"Importerade transaktioner",transactions:txs});
    });
  }
  setItems(items);
  const n=PARSED.length; PARSED=[];
  toast(`✅ ${n} transaktioner importerade och sorterade.`,"good");
  celebrate(false); chime(false);
  go("kostnader");
}

/* ---- Fullständig data-import (CostPulse-export: JSON eller kostnader.csv) ---- */
const MONTH_LABEL={westros:{"juni-2026":"Westros – juni 2026","juli-2026":"Westros – juli 2026","aktuell":"Westros"},eefs:{"aktuell":"EEFS"}};
function importFullData(f){
  const r=new FileReader();
  r.onload=()=>{
    const text=r.result;
    let datasets=null;
    try{
      const d=JSON.parse(text);
      if(d && (d.june2026 || d.july2026 || d.companies)) datasets=datasetsFromExportJson(d);
      else if(d && Array.isArray(d.items)){ // egen backup
        restoreBackup(d); toast("Backup återställd ("+(d.ns||"okänt bolag")+").","good"); render(); return;
      }
    }catch(e){ /* inte JSON – prova CSV */ }
    if(!datasets){
      const first=(text.split(/\r?\n/)[0]||"").toLowerCase();
      if(/^bolag;.*namn;.*belopp/.test(first)) datasets=datasetsFromKostnaderCsv(text);
      else if(/^bolag;.*kostnadspost/.test(first)){ toast("Det här är transaktioner.csv – ladda upp kostnader.csv eller costpulse-data.json för fullständig data.","bad"); return; }
    }
    if(!datasets || !datasets.length){ toast("Kände inte igen filformatet. Använd JSON-backup, costpulse-data.json eller kostnader.csv.","bad"); return; }
    showDatasetChooser(datasets);
  };
  r.readAsText(f);
}
function normItem(o){ return {name:String(o.name||""),amount:+o.amount||0,category:o.category||"Övrigt",interval:o.interval||"månad",note:o.note||undefined,
  transactions:Array.isArray(o.transactions)?o.transactions.map(t=>({id:t.id||uid(),date:t.date||undefined,description:String(t.description||""),amount:+t.amount||0})):undefined}; }
function datasetsFromExportJson(d){
  const out=[];
  // Nytt format: { companies: { westros:{months:{...}}, eefs:{items:[...]} } }
  if(d.companies && !Array.isArray(d.companies) && typeof d.companies==="object"){
    Object.keys(d.companies).forEach(bolag=>{ const c=d.companies[bolag];
      const sav=(c.savings&&typeof c.savings==="object")?c.savings:{};
      if(c.months && typeof c.months==="object"){ Object.keys(c.months).forEach(manad=>{
        const arr=c.months[manad]; if(Array.isArray(arr)) out.push({bolag,manad,items:arr.map(normItem),savings:sav[manad]||null}); }); }
      if(Array.isArray(c.items)) out.push({bolag,manad:"aktuell",items:c.items.map(normItem),savings:sav["aktuell"]||null});
    });
    if(out.length) return out;
  }
  // Äldre format: { june2026:{items}, july2026:{items}, companies:[{id,seedItems}] }
  if(d.june2026&&d.june2026.items) out.push({bolag:"westros",manad:"juni-2026",items:d.june2026.items.map(normItem)});
  if(d.july2026&&d.july2026.items) out.push({bolag:"westros",manad:"juli-2026",items:d.july2026.items.map(normItem)});
  if(Array.isArray(d.companies)){ const e=d.companies.find(c=>c.id==="eefs"); if(e&&e.seedItems) out.push({bolag:"eefs",manad:"aktuell",items:e.seedItems.map(normItem)}); }
  return out;
}
function splitCsvLine(line){ const out=[]; let cur="",q=false; for(let i=0;i<line.length;i++){const c=line[i];
  if(c==='"'){ if(q&&line[i+1]==='"'){cur+='"';i++;} else q=!q; } else if(c===';'&&!q){ out.push(cur);cur=""; } else cur+=c; } out.push(cur); return out.map(s=>s.trim()); }
function datasetsFromKostnaderCsv(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  const header=splitCsvLine(lines[0]).map(h=>h.toLowerCase());
  const col=n=>header.indexOf(n);
  const cB=col("bolag"),cM=col("manad"),cN=col("namn"),cA=col("belopp"),cI=col("intervall"),cK=col("kategori"),cNo=col("anteckning");
  const groups={};
  for(let i=1;i<lines.length;i++){ const p=splitCsvLine(lines[i]); if(p.length<3) continue;
    const bolag=(p[cB]||"westros").toLowerCase(), manad=p[cM]||"aktuell";
    const key=bolag+"|"+manad; (groups[key]=groups[key]||{bolag,manad,items:[]}).items.push({
      name:p[cN]||"", amount:parseSwedishNumber(p[cA]), category:CATEGORIES.includes(p[cK])?p[cK]:"Övrigt",
      interval:INTERVALS.includes(p[cI])?p[cI]:"månad", note:p[cNo]||undefined });
  }
  return Object.values(groups).map(g=>({bolag:g.bolag,manad:g.manad,items:g.items.filter(i=>i.name&&!isNaN(i.amount))}));
}
window.__DS=[];
function showDatasetChooser(datasets){
  window.__DS=datasets;
  const el=document.getElementById("dschooser"); if(!el) return;
  el.innerHTML=`<div class="row wrap" style="justify-content:space-between;align-items:center;margin-bottom:8px"><span class="muted small">Hittade ${datasets.length} dataset. Ladda in en månad – eller allt på en gång:</span>
      ${datasets.length>1?`<button class="btn green solid sm" onclick="loadAllDatasets()">✅ Ladda in ALLA</button>`:""}</div>`+
    datasets.map((d,idx)=>{ const label=(MONTH_LABEL[d.bolag]&&MONTH_LABEL[d.bolag][d.manad])||(d.bolag+" – "+d.manad);
      const sum=d.items.reduce((s,i)=>s+monthlyAmount(i),0), tx=d.items.reduce((s,i)=>s+((i.transactions||[]).length),0);
      return `<div class="kv"><span><b>${esc(label)}</b><br><span class="muted small">${d.items.length} poster · ${fmtSEK(sum)}/mån${tx?` · ${tx} transaktioner`:""}</span></span>
        <button class="btn accent sm" onclick="loadImportedDataset(${idx})">Ladda in →</button></div>`;
    }).join("");
}
function writeDatasetSavings(d){
  if(!d.savings || !d.savings.length){ localStorage.setItem(savingsKey(d.manad), JSON.stringify([])); return; }
  const rows=d.savings.map(e=>({id:uid(), t:Date.parse(e.date||"")||Date.now(), amount:+e.amount||0,
    description:String(e.description||"Besparing"), target:e.target||undefined}));

}
function pruneEmptyAktuell(){ const months=getMonths();

function loadImportedDataset(idx){
  const d=window.__DS[idx]; if(!d) return;
  if(d.bolag!==State.ns && COMPANIES[d.bolag]) State.ns=d.bolag;
  ensureMonth(d.manad); setCurMonth(d.manad);
  localStorage.setItem(costKey(d.manad), JSON.stringify(withIds(d.items)));
  localStorage.setItem(simKey(d.manad), JSON.stringify([]));
  writeDatasetSavings(d);
  pruneEmptyAktuell(); setCurMonth(d.manad); snapshotIfNeeded();
  const label=(MONTH_LABEL[d.bolag]&&MONTH_LABEL[d.bolag][d.manad])||d.bolag;
  toast(`✅ Laddade in ${esc(label)} – ${d.items.length} poster.`,"good");

  State.tab="oversikt"; render();
}
function loadAllDatasets(){
  const ds=window.__DS||[]; if(!ds.length) return;
  let firstNs=null, firstMonth=null, n=0;
  ds.forEach(d=>{ if(!COMPANIES[d.bolag]) return;
    State.ns=d.bolag; ensureMonth(d.manad);
    localStorage.setItem(costKey(d.manad), JSON.stringify(withIds(d.items)));
    localStorage.setItem(simKey(d.manad), JSON.stringify([]));
    writeDatasetSavings(d);
    setCurMonth(d.manad); n++;
    if(firstNs===null){ firstNs=d.bolag; firstMonth=d.manad; }
  });
  if(firstNs){ State.ns=firstNs; setCurMonth(firstMonth); }
  ds.forEach(d=>{ if(COMPANIES[d.bolag]){ const p=State.ns; State.ns=d.bolag; pruneEmptyAktuell(); State.ns=p; } });
  if(firstNs){ State.ns=firstNs; setCurMonth(firstMonth); }
  toast(`✅ ${n} dataset inlästa som månader – växla månad uppe i toppen.`,"good");
  celebrate(true); chime(false);
  State.tab="oversikt"; render();
}
function restoreBackup(d){
  if(d.ns && COMPANIES[d.ns]) State.ns=d.ns;
  if(d.items) localStorage.setItem(costKey(),JSON.stringify(d.items));
  if(d.settings) localStorage.setItem(State.k.settings,JSON.stringify(d.settings));
  if(d.savings) localStorage.setItem(savingsKey(),JSON.stringify(d.savings));
  if(d.costlog) localStorage.setItem(costlogKey(),JSON.stringify(d.costlog));
  if(d.focus) localStorage.setItem(State.k.focus,JSON.stringify(d.focus));
  if(d.stores) localStorage.setItem(State.k.stores,JSON.stringify(d.stores));
  if(d.history) localStorage.setItem(State.k.history,JSON.stringify(d.history));
}

/* ---- Export ---- */
function download(name,content,type){
  // Försök ladda ner en fil. I hostad sandbox blockeras detta – då visas innehållet att kopiera.
  let ok=false;
  try{
    const blob=new Blob([content],{type:type||"text/plain;charset=utf-8"});
    const url=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=url; a.download=name; document.body.appendChild(a);
    a.click(); ok=true;
    setTimeout(()=>{a.remove();URL.revokeObjectURL(url);},200);
  }catch(e){ ok=false; }
  showExport(name, content, ok);
}
function showExport(name, content, downloadTried){
  openModal(`<h3>Exportera: ${esc(name)}</h3>
    <div class="muted small">${downloadTried?"Filen laddas ner om din webbläsare tillåter det. ":""}Annars – markera allt och kopiera texten nedan.</div>
    <textarea id="exp-ta" rows="10" style="margin-top:10px;font-family:ui-monospace,monospace;font-size:12px" readonly>${esc(content)}</textarea>
    <div class="row wrap" style="margin-top:12px;gap:8px">
      <button class="btn accent" onclick="copyExport()">Kopiera allt</button>
      <button class="btn" onclick="dlExport('${esc(name)}')">Ladda ner fil</button>
      <button class="btn ghost" onclick="closeModal()">Stäng</button>
    </div>`);
  window.__expContent=content; window.__expName=name;
}
function copyExport(){ const ta=document.getElementById("exp-ta"); ta.focus(); ta.select();
  try{ navigator.clipboard.writeText(window.__expContent); }catch(e){ try{document.execCommand("copy");}catch(_){} }
  toast("Kopierat till urklipp.","good"); }
function dlExport(name){ try{ const blob=new Blob([window.__expContent],{type:"text/plain;charset=utf-8"});
  const url=URL.createObjectURL(blob), a=document.createElement("a"); a.href=url; a.download=name||window.__expName; document.body.appendChild(a); a.click();
  setTimeout(()=>{a.remove();URL.revokeObjectURL(url);},200); toast("Nedladdning startad.","good"); }catch(e){ toast("Nedladdning blockerad – kopiera texten istället.","bad"); } }
function csvCell(v){ v=String(v==null?"":v); return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function csvJoin(rows){ return rows.map(r=>r.map(csvCell).join(";")).join("\n"); }

function itemsForMonth(m){ return (load(costKey(m), []) || []); }
function logDeltaFor(m){ return sum(load(costlogKey(m),[])) - sum(load(savingsKey(m),[])); }
function totalForMonth(m){ return Math.max(0, itemsForMonth(m).reduce((s,i)=>s+monthlyAmount(i),0) + logDeltaFor(m)); }
function setCmp(which,val){ State["cmp"+which]=val; renderTab(); }
function tabJamfor(){
  const months=getMonths();
  if(months.length<2) return `<div class="card"><h3>⇄ Jämför månader</h3><div class="muted small">Du behöver minst två månader för att jämföra. Ladda in data via <b>Import → "Ladda in ALLA"</b> (skapar juni + juli), eller lägg till en månad med ＋ i toppen.</div></div>`;
  if(!State.cmpA||months.indexOf(State.cmpA)<0) State.cmpA=months[0];
  if(!State.cmpB||months.indexOf(State.cmpB)<0) State.cmpB=months[1]||months[0];
  const A=itemsForMonth(State.cmpA), B=itemsForMonth(State.cmpB);
  const totA=totalForMonth(State.cmpA), totB=totalForMonth(State.cmpB);
  const savA=sum(load(savingsKey(State.cmpA),[])), savB=sum(load(savingsKey(State.cmpB),[]));
  const diff=totB-totA, pct=totA?(diff/totA*100):0, down=diff<=0;
  const opt=sel=>months.map(m=>`<option value="${esc(m)}" ${m===sel?"selected":""}>${esc(monthNice(m))}</option>`).join("");
  const col=(label,items,tot,accent,sav)=>`<div class="innerbox"><div class="eyebrow" style="color:${accent}">${esc(label)}</div>
    <div class="tabular" style="font-size:24px;font-weight:800;margin-top:4px">${fmtSEK(tot)}<span class="muted small" style="font-weight:400">/mån</span></div>
    <div class="muted small">${fmtSEK(tot*12)}/år · daglig ${fmtSEK(tot/30)}</div><div class="muted small">${items.length} poster${sav>0?` · <span style="color:var(--success)">−${fmtSEK(sav)} loggat</span>`:""}</div></div>`;
  let html=`<div class="card"><div class="row wrap" style="justify-content:space-between;align-items:center;gap:8px">
      <div><div class="eyebrow">Jämför månader</div><h3>Vad hände mellan månaderna?</h3></div>
      <div class="row" style="gap:6px;align-items:center;flex-wrap:nowrap"><select onchange="setCmp('A',this.value)" style="width:auto;font-weight:600">${opt(State.cmpA)}</select><span class="muted">vs</span><select onchange="setCmp('B',this.value)" style="width:auto;font-weight:600">${opt(State.cmpB)}</select></div>
    </div>
    <div class="split cmpcols" style="margin-top:14px">${col(monthNice(State.cmpA),A,totA,"var(--muted-foreground)",savA)}${col(monthNice(State.cmpB),B,totB,"var(--accent)",savB)}</div>
    <div class="innerbox" style="margin-top:12px;background:color-mix(in oklab,${down?"var(--success)":"var(--danger)"} 14%,transparent);border-color:${down?"var(--success)":"var(--danger)"}">
      <div class="eyebrow">Skillnad · ${esc(monthNice(State.cmpB))} mot ${esc(monthNice(State.cmpA))}</div>
      <div class="tabular" style="font-size:26px;font-weight:800;color:${down?"var(--success)":"var(--danger)"}">${down?"−":"+"}${fmtSEK(Math.abs(diff))}/mån</div>
      <div class="muted small">${down?"−":"+"}${fmtSEK(Math.abs(diff*12))}/år · ${down?"":"+"}${pct.toFixed(1)}% · daglig ${down?"−":"+"}${fmtSEK(Math.abs(diff/30))}</div>
    </div></div>`;
  // per kategori
  const catA={},catB={}; CATEGORIES.forEach(c=>{catA[c]=0;catB[c]=0;});
  A.forEach(i=>catA[i.category]+=monthlyAmount(i)); B.forEach(i=>catB[i.category]+=monthlyAmount(i));
  const maxCat=Math.max(1,...CATEGORIES.map(c=>Math.max(catA[c],catB[c])));
  html+=`<div class="card" style="margin-top:16px"><h3>Per kategori</h3><div class="muted small">Grå = ${esc(monthNice(State.cmpA))} · färgad = ${esc(monthNice(State.cmpB))}</div><div style="margin-top:12px">`+
    CATEGORIES.filter(c=>catA[c]||catB[c]).map(c=>{ const d=catB[c]-catA[c];
      return `<div style="margin-bottom:14px"><div class="row" style="justify-content:space-between"><b class="small">${esc(c)}</b><span class="tabular small" style="color:${d<=0?"var(--success)":"var(--danger)"}">${Math.abs(d)<0.5?"±0":(d<0?"−":"+")+fmtSEK(Math.abs(d))}</span></div>
        <div class="row" style="gap:8px;align-items:center;margin-top:4px"><span class="tabular muted small" style="width:78px;text-align:right;flex:none">${fmtSEK(catA[c])}</span><div class="barbg" style="flex:1;height:9px"><div class="barfill" style="width:${catA[c]/maxCat*100}%;background:var(--muted-foreground)"></div></div></div>
        <div class="row" style="gap:8px;align-items:center;margin-top:3px"><span class="tabular muted small" style="width:78px;text-align:right;flex:none">${fmtSEK(catB[c])}</span><div class="barbg" style="flex:1;height:9px"><div class="barfill" style="width:${catB[c]/maxCat*100}%;background:var(--accent)"></div></div></div>
      </div>`;
    }).join("")+`</div></div>`;
  // post-diff
  const nk=i=>i.name.trim().toLowerCase();
  const mapA={},mapB={}; A.forEach(i=>mapA[nk(i)]=i); B.forEach(i=>mapB[nk(i)]=i);
  const removed=A.filter(i=>!mapB[nk(i)]);
  const added=B.filter(i=>!mapA[nk(i)]);
  const changed=B.filter(i=>mapA[nk(i)]).map(i=>({name:i.name,a:monthlyAmount(mapA[nk(i)]),b:monthlyAmount(i)})).filter(x=>Math.abs(x.b-x.a)>0.5);
  const lowered=changed.filter(x=>x.b<x.a), raised=changed.filter(x=>x.b>x.a);
  const box=(title,color,rows)=>`<div class="innerbox"><div class="row" style="align-items:center;gap:6px"><span style="width:8px;height:8px;border-radius:99px;background:${color};flex:none"></span><b class="small">${title} (${rows.length})</b></div><div style="margin-top:6px">${rows.length?rows.join(""):`<div class="muted small">Inga.</div>`}</div></div>`;

  const lo=lowered.map(x=>`<div class="kv"><span class="small">${esc(x.name)}<br><span class="muted" style="font-size:11px">${fmtSEK(x.a)} → ${fmtSEK(x.b)}</span></span><span class="tabular small" style="color:var(--success)">−${fmtSEK(x.a-x.b)}</span></div>`);
  const ra=raised.map(x=>`<div class="kv"><span class="small">${esc(x.name)}<br><span class="muted" style="font-size:11px">${fmtSEK(x.a)} → ${fmtSEK(x.b)}</span></span><span class="tabular small" style="color:var(--danger)">+${fmtSEK(x.b-x.a)}</span></div>`);
  html+=`<div class="card" style="margin-top:16px"><h3>Vad ändrades post för post?</h3><div class="muted small">Från ${esc(monthNice(State.cmpA))} till ${esc(monthNice(State.cmpB))}. Grönt = lägre kostnad.</div>
    <div class="split" style="margin-top:12px">${box("💚 Borttagna","var(--success)",rm)}${box("🔴 Nya","var(--danger)",ad)}</div>
    <div class="split" style="margin-top:12px">${box("↓ Sänkta","var(--success)",lo)}${box("↑ Ökade","var(--danger)",ra)}</div></div>`;
  return html;
}

    <label class="field" style="margin-top:10px">Kategori</label><select id="d-cat">${CATEGORIES.map(c=>{const def=it?it.category:(localStorage.getItem("slimma.lastcat")||"Mjukvara/SaaS");return `<option ${def===c?"selected":""}>${esc(c)}</option>`;}).join("")}</select>
    <label class="field" style="margin-top:10px">Anteckning</label><textarea id="d-note" rows="2">${it?esc(it.note||""):""}</textarea>
    <div id="d-calc" class="muted small" style="margin-top:8px"></div>
    <div class="row" style="margin-top:14px;gap:8px"><button class="btn primary" onclick="saveItem(${it?`'${id}'`:"null"})">Spara</button><button class="btn" onclick="closeModal()">Avbryt</button></div>`);
  const upd=()=>{ const a=parseSwedishNumber(document.getElementById("d-amt").value),iv=document.getElementById("d-int").value;
    const m=isNaN(a)?0:(iv==="kvartal"?a/3:iv==="år"?a/12:a); document.getElementById("d-calc").innerHTML=isNaN(a)?"":`= ${fmtSEK(m)}/mån · ${fmtSEK(m*12)}/år`; };
  document.getElementById("d-amt").addEventListener("input",upd); document.getElementById("d-int").addEventListener("change",upd); upd();
}
function saveItem(id){
  const name=document.getElementById("d-name").value.trim();
  const amt=parseSwedishNumber(document.getElementById("d-amt").value);
  if(!name){ toast("Namn krävs.","bad"); return; }
  if(isNaN(amt)){ toast("Ogiltigt belopp.","bad"); return; }
  const patch={name,amount:amt,interval:document.getElementById("d-int").value,category:document.getElementById("d-cat").value,note:document.getElementById("d-note").value.trim()||undefined};
  const items=getItems();
  try{ localStorage.setItem("slimma.lastcat", patch.category); }catch(e){}
  if(id){ const i=items.find(x=>x.id===id); Object.assign(i,patch); } else items.push(Object.assign({id:uid()},patch));
  setItems(items); closeModal(); render(); toast(id?"Post uppdaterad.":"Post tillagd.","good");
}
let LAST_DELETED=null;
function removeItem(id){ const it=getItems().find(i=>i.id===id); if(!it) return;
  LAST_DELETED={item:it, ns:State.ns, month:curMonth()};
  setItems(getItems().filter(i=>i.id!==id)); const s=getSim(); s.delete(id); setSim(s); render();
  toast(`Raderade <b>${esc(it.name)}</b> · <a href="#" onclick="undoDelete();return false" style="font-weight:700">ÅNGRA</a>`,"bad"); }
function undoDelete(){ if(!LAST_DELETED){ toast("Inget att ångra.","bad"); return; }
  const d=LAST_DELETED; LAST_DELETED=null;
  State.ns=d.ns; setCurMonth(d.month);
  const items=load(costKey(d.month),[])||[]; items.push(d.item);
  localStorage.setItem(costKey(d.month), JSON.stringify(items));
  render(); toast(`↩ ${esc(d.item.name)} återställd.`,"good"); }
function toggleSim(id){ const s=getSim(); s.has(id)?s.delete(id):s.add(id); setSim(s); render(); }
function clearSim(){ setSim(new Set()); render(); }

function openReduce(id){ const it=getItems().find(i=>i.id===id);
  openModal(`<h3>Sänk: ${esc(it.name)}</h3><div class="muted small">Nuvarande ${fmtSEK(monthlyAmount(it))}/mån.</div>
    <label class="field" style="margin-top:10px">Sänkning (kr/mån)</label><input id="r-amt" placeholder="t.ex. 200">
    <label class="field" style="margin-top:10px">Notering</label><input id="r-note" placeholder="Förhandlade bort 200 kr">
    <div class="row" style="margin-top:14px;gap:8px"><button class="btn green solid" onclick="doReduce('${id}')">💚 Sänk & logga</button><button class="btn" onclick="closeModal()">Avbryt</button></div>`);
}
function doReduce(id){ const cut=parseSwedishNumber(document.getElementById("r-amt").value);
  if(isNaN(cut)||cut<=0){ toast("Ange en giltig sänkning.","bad"); return; }
  const items=getItems(), it=items.find(i=>i.id===id); const note=document.getElementById("r-note").value.trim();
  const newAmt=monthlyAmount(it)-cut; // reduce in monthly terms; convert back
  const factor=it.interval==="kvartal"?3:it.interval==="år"?12:1;
  it.amount=Math.max(0,(monthlyAmount(it)-cut))*factor;
  let removed=false; if(it.amount<=0){ removed=true; }
  const savings=getSavings(); savings.unshift({id:uid(),t:Date.now(),amount:cut,description:note||("Sänkte "+it.name),target:it.name});
  if(removed){ setItemsRaw(items.filter(i=>i.id!==id)); } else setItemsRaw(items);
  save(savingsKey(),savings); snapshotIfNeeded();
  closeModal(); celebrate(cut>=5000); chime(false); haptic(40);
  toast(`💚 −${fmtSEK(cut)}/mån (−${fmtSEK(cut*12)}/år)!`,"good"); render();
}

function openNegotiation(id){ const it=getItems().find(i=>i.id===id); const n=it.negotiation||{status:"pågår",note:""};
  openModal(`<h3>Förhandla: ${esc(it.name)}</h3>
    <label class="field">Status</label><select id="n-status">${["pågår","väntar_svar","vunnen","förlorad"].map(v=>`<option ${n.status===v?"selected":""}>${v}</option>`).join("")}</select>

    <label class="field" style="margin-top:10px">Notering</label><textarea id="n-note" rows="2">${esc(n.note||"")}</textarea>
    <div class="row" style="margin-top:14px;gap:8px"><button class="btn accent" onclick="saveNeg('${id}')">Spara</button>${it.negotiation?`<button class="btn" onclick="clearNeg('${id}')">Ta bort förhandling</button>`:""}<button class="btn" onclick="closeModal()">Avbryt</button></div>`);
}
function saveNeg(id){ const items=getItems(), it=items.find(i=>i.id===id);
  const t=parseSwedishNumber(document.getElementById("n-target").value);
  it.negotiation={status:document.getElementById("n-status").value,contact:document.getElementById("n-contact").value.trim()||undefined,targetAmount:isNaN(t)?undefined:t,note:document.getElementById("n-note").value.trim(),updatedAt:Date.now()};
  setItems(items); closeModal(); render(); toast("Förhandling sparad.","good"); }
function clearNeg(id){ const items=getItems(), it=items.find(i=>i.id===id); delete it.negotiation; setItems(items); closeModal(); render(); }

function openTx(id){ const it=getItems().find(i=>i.id===id); const txs=it.transactions||[];
  const tot=txs.reduce((s,t)=>s+t.amount,0);
  openModal(`<h3>${esc(it.name)} – transaktioner</h3><div class="muted small">${txs.length} rader · summa ${fmtSEK(tot)}</div>
    <div style="overflow-x:auto;margin-top:10px;max-height:50vh"><table><thead><tr><th>Datum</th><th>Beskrivning</th><th class="num">Belopp</th><th></th></tr></thead><tbody id="txbody">${txRows(it)}</tbody></table></div>
    <div class="split" style="margin-top:12px"><input id="tx-desc" placeholder="Ny transaktion – beskrivning"><input id="tx-amt" placeholder="belopp"></div>
    <button class="btn accent sm" style="margin-top:8px" onclick="addTx('${id}')">＋ Lägg till transaktion</button>`);
}
function txRows(it){ return (it.transactions||[]).map(t=>`<tr><td class="muted small">${esc(t.date||"–")}</td><td>${esc(t.description)}</td><td class="num tabular">${fmtSEK(t.amount)}</td><td><button class="btn sm ghost" onclick="delTx('${it.id}','${t.id}')">🗑</button></td></tr>`).join(""); }
function addTx(id){ const items=getItems(), it=items.find(i=>i.id===id);
  const d=document.getElementById("tx-desc").value.trim(), a=parseSwedishNumber(document.getElementById("tx-amt").value);
  if(!d||isNaN(a)){ toast("Fyll i beskrivning och giltigt belopp.","bad"); return; }
  it.transactions=(it.transactions||[]).concat([{id:uid(),description:d,amount:a}]);
  setItems(items); document.getElementById("txbody").innerHTML=txRows(it); document.getElementById("tx-desc").value="";document.getElementById("tx-amt").value=""; toast("Transaktion tillagd.","good"); }
function delTx(id,txId){ const items=getItems(), it=items.find(i=>i.id===id); it.transactions=it.transactions.filter(t=>t.id!==txId); setItems(items); document.getElementById("txbody").innerHTML=txRows(it); }

/* ============================= Logs ============================= */
function addLog(kind){
  const amt=parseSwedishNumber(document.getElementById(kind+"-amt").value);
  const desc=document.getElementById(kind+"-desc").value.trim();
  const target=document.getElementById(kind+"-target").value||undefined;
  if(isNaN(amt)||amt<=0){ toast("Ange ett giltigt belopp.","bad"); return; }
  if(!desc){ toast("Ange en beskrivning.","bad"); return; }
  const key=kind==="saving"?savingsKey():costlogKey();
  const arr=load(key,[]); arr.unshift({id:uid(),t:Date.now(),amount:amt,description:desc,target});
  save(key,arr); snapshotIfNeeded();
  if(kind==="saving"){ celebrate(amt>=5000); chime(false); haptic(40); toast(`💚 −${fmtSEK(amt)}/mån (−${fmtSEK(amt*12)}/år)!`,"good");
    // milestones
    const tot=sum(getSavings()); [1000,5000,10000,25000,50000,100000,250000,500000].forEach(m=>{ if(tot>=m && tot-amt<m){ setTimeout(()=>{celebrate(true);toast(`🏆 Milstolpe: ${fmtSEK(m)}/mån sparat!`,"good");},400); } });
  } else { chime(false); toast(`+${fmtSEK(amt)}/mån loggat.`,"bad"); }
  render();
}
function removeLog(kind,id){ const key=kind==="saving"?savingsKey():costlogKey(); save(key,load(key,[]).filter(e=>e.id!==id)); snapshotIfNeeded(); render(); }
function clearHistory(){ if(!confirm("Rensa trendhistoriken?")) return; localStorage.setItem(State.k.history,JSON.stringify([])); render(); }

/* ============================= Mobil / QR ============================= */

  openModal(`<h3>📱 Öppna CostPulse på mobilen</h3>

function copyUrl(){ try{ navigator.clipboard.writeText(APP_URL); }catch(e){} toast("Länk kopierad.","good"); }

/* ============================= Auto-uppdatering ============================= */
function baseUrl(){ return location.href.split("#")[0].split("?")[0]; }
function showUpdateBanner(ver){ const b=document.getElementById("updateBanner"); if(!b) return;
  document.getElementById("updateVer").textContent="Ny version ("+ver+"). Klicka för att uppdatera nu.";
  b.style.display="block"; }
function doUpdate(latest){ // ladda om med cache-bust så den hämtar den nya filen
  const v=(typeof latest==="string"&&latest)||("cb"+Date.now());
  location.replace(baseUrl()+"?v="+encodeURIComponent(v)); }
async function checkForUpdate(){
  try{
    const r=await fetch(baseUrl()+"?cb="+Date.now(),{cache:"no-store"});
    if(!r.ok) return;
    const txt=await r.text();
    const m=txt.match(/const VERSION\s*=\s*"([^"]+)"/);
    const latest=m&&m[1];
    if(latest && latest!==VERSION){
      showUpdateBanner(latest);
      // auto-uppdatera EN gång per session per målversion (undvik loop om cachen är envis)
      const guard="slimma.autoreloaded";
      if(sessionStorage.getItem(guard)!==latest){
        sessionStorage.setItem(guard, latest);
        setTimeout(()=>doUpdate(latest), 1200);
      }
    }
  }catch(e){ /* same-origin fetch ej tillåten – relaunch hämtar ändå senaste */ }
}
function initUpdates(){
  try{
    const seen=localStorage.getItem("slimma.seenversion");
    if(seen && seen!==VERSION) toast("✅ Uppdaterad till senaste version ("+VERSION+").","good");
    localStorage.setItem("slimma.seenversion", VERSION);
  }catch(e){}
  checkForUpdate();
  setInterval(checkForUpdate, 60000);
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) checkForUpdate(); });
}

/* ============================= Lösenordslås (krypterad data) ============================= */
function hasEnc(){ return typeof ENC_DATA==="string" && ENC_DATA.length>40 && ENC_DATA.indexOf("__ENC")!==0; }
function isUnlocked(){ return localStorage.getItem("slimma.unlocked")==="1"; }
function anyData(){ return getItems().length>0; }
function openLock(canClose){
  openModal(`<h3>🔒 Lås upp din data</h3>
    <div class="muted small">Din kostnadsdata (juni + juli) är krypterad. Ange lösenordet för att visa den. Den sparas sedan lokalt på den här enheten.</div>
    <label class="field" style="margin-top:12px">Lösenord</label>
    <input id="lockpw" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Lösenord" onkeydown="if(event.key==='Enter')submitLock()">
    <div id="lockerr" class="small" style="color:var(--danger);margin-top:6px"></div>
    <div class="row" style="margin-top:14px;gap:8px"><button class="btn accent" onclick="submitLock()">🔓 Lås upp</button>${canClose?`<button class="btn" onclick="closeModal()">Senare</button>`:""}</div>`);
  setTimeout(()=>{ const el=document.getElementById("lockpw"); if(el) el.focus(); },100);
}
async function submitLock(){
  const el=document.getElementById("lockpw"); const pw=el?el.value:"";
  const btn=document.querySelector('#modal .btn.accent'); if(btn){btn.textContent="Låser upp…";btn.disabled=true;}
  const ok=await unlockData(pw);
  if(!ok){ const e=document.getElementById("lockerr"); if(e) e.textContent="Fel lösenord. Försök igen."; if(btn){btn.textContent="🔓 Lås upp";btn.disabled=false;} }
}
async function unlockData(password){
  try{
    if(!hasEnc()) return false;
    const raw=Uint8Array.from(atob(ENC_DATA), c=>c.charCodeAt(0));
    const salt=raw.slice(0,16), iv=raw.slice(16,28), ct=raw.slice(28);
    const km=await crypto.subtle.importKey("raw", new TextEncoder().encode(password), {name:"PBKDF2"}, false, ["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:150000,hash:"SHA-256"}, km, {name:"AES-GCM",length:256}, false, ["decrypt"]);
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv}, key, ct);
    const json=JSON.parse(new TextDecoder().decode(pt));
    window.__DS=datasetsFromExportJson(json);
    loadAllDatasets();
    localStorage.setItem("slimma.unlocked","1");
    try{ localStorage.setItem("slimma.datastamp", DATA_STAMP); localStorage.setItem("slimma.pw", password); }catch(e){}
    closeModal();
    return true;
  }catch(e){ return false; }
}
function relockData(){ if(!confirm("Lås och rensa datan från den här enheten? (Den ligger kvar krypterad och kan låsas upp igen.)")) return;
  ["westros","eefs"].forEach(ns=>{ const pre="slimma."+ns+"."; Object.keys(localStorage).forEach(k=>{ if(k.indexOf(pre)===0) localStorage.removeItem(k); }); });
  localStorage.removeItem("slimma.unlocked"); localStorage.removeItem("slimma.pw"); localStorage.removeItem("slimma.datastamp"); location.reload(); }
function maybeLock(){ if(hasEnc() && !isUnlocked() && !anyData()){ openLock(true); return; } maybeDataRefresh(); }
function maybeDataRefresh(){
  if(!hasEnc() || !isUnlocked()) return;
  if(localStorage.getItem("slimma.datastamp")===DATA_STAMP) return;
  const b=document.getElementById("dataBanner"); if(b) b.style.display="block";
}
async function refreshData(){
  const pw=localStorage.getItem("slimma.pw");
  const b=document.getElementById("dataBanner"); if(b) b.style.display="none";
  if(pw && await unlockData(pw)){ toast("✅ Data uppdaterad till senaste versionen.","good"); return; }
  openLock(true);
}
function dismissDataBanner(){ const b=document.getElementById("dataBanner"); if(b) b.style.display="none";
  try{ localStorage.setItem("slimma.datastamp", DATA_STAMP); }catch(e){} }
function onLockBtn(){ if(isUnlocked()) relockData(); else openLock(true); }
function updateLockBtn(){ const b=document.getElementById("lockBtn"); if(!b) return;
  if(!hasEnc()){ b.style.display="none"; return; }
  b.style.display=""; b.textContent=isUnlocked()?"🔒 Lås":"🔓 Lås upp"; }

/* ============================= Switcher + sync ============================= */
document.getElementById("switcher").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; State.ns=b.dataset.co; State.tab="oversikt"; render(); });
window.addEventListener("slimma:store-sync",()=>{ /* re-render current tab lightly */ if(document.getElementById("tabbody")) renderTab(); });
window.addEventListener("storage",()=>render());

/* boot */
render();
initUpdates();
maybeLock();
</script>
